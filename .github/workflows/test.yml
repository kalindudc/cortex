name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The same gates on Linux (glibc) and macOS, under the pinned Bun.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: pnpm/action-setup@v4
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: agents.md drift check
        run: pnpm run agents:check
      - name: style
        run: pnpm run style:check
      - name: bun:test (build + unit + integration)
        run: pnpm test
